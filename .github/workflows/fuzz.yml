name: Fuzz

# Coverage-guided fuzzing of the text entry points with Atheris
# (fuzz/fuzz_inputs.py): the IBAN, BIC and LEI validators, the SWIFT
# character-set check and cleanser, and XML-string validation. A short
# run on every change; a longer one weekly. A crash fails the job and the
# reproducer is uploaded.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:30 UTC.
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  atheris:
    name: Atheris (text entry points)
    # Atheris ships Linux x86_64 wheels only; fuzz.txt is compiled for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install fuzz toolchain and this package (hash-pinned)
        run: |
          python -m pip install --require-hashes -r requirements/fuzz.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '120' }}
        run: |
          mkdir -p crashes
          python fuzz/fuzz_inputs.py fuzz/corpus \
            -max_total_time="$FUZZ_SECONDS" \
            -artifact_prefix=crashes/

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
